services:
  api:
    build: .
    image: healthcare-claims-mlops:latest
    container_name: healthcare-api
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      start_period: 40s
      retries: 3
    restart: unless-stopped

  dashboard:
    build: .
    image: healthcare-claims-mlops:latest
    container_name: healthcare-dashboard
    # Same image, different entrypoint. The dashboard scores in-process from
    # exported_model/ rather than calling the API, so it needs no network
    # dependency on the api service -- that is what lets the same file deploy
    # unchanged to Streamlit Community Cloud, where no API exists.
    command:
      - streamlit
      - run
      - app/dashboard/app.py
      - --server.port=8501
      - --server.address=0.0.0.0
      - --server.headless=true
    ports:
      - "8501:8501"
    restart: unless-stopped
