name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    name: Lint and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint
        run: |
          ruff check .
          ruff format --check .

      - name: Test
        # The raw Excel sources are DVC-tracked and absent from a fresh clone.
        # The suite is built to run without them: fixtures are synthetic and the
        # API tests load the committed exported_model/.
        run: pytest -q

  docker:
    name: Build image and smoke-test the API
    runs-on: ubuntu-latest
    needs: lint-and-test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install smoke-test dependency
        run: pip install requests

      - uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: healthcare-claims-mlops:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Start the API
        run: docker run -d --name api -p 8000:8000 healthcare-claims-mlops:ci

      - name: Smoke-test the API
        run: python scripts/smoke_test.py http://localhost:8000

      - name: Container logs on failure
        if: failure()
        run: docker logs api

      - name: Stop the API
        if: always()
        run: docker rm -f api || true
